<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokemon Auto Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <div class="banner">
        <div class="slider" style="--quantity: 14">

            <div class="items" style="--position: 1"><img src="Pokemon/Bulbasaur.png" alt=""></div>
            <div class="items" style="--position: 2"><img src="Pokemon/Charizard.png" alt=""></div>
            <div class="items" style="--position: 3"><img src="Pokemon/Eevee.png" alt=""></div>
            <div class="items" style="--position: 4"><img src="Pokemon/Flareon.png" alt=""></div>
            <div class="items" style="--position: 5"><img src="Pokemon/Gengar.png" alt=""></div>
            <div class="items" style="--position: 6"><img src="Pokemon/Jigglypuff.png" alt=""></div>
            <div class="items" style="--position: 7"><img src="Pokemon/Lapras.png" alt=""></div>
            <div class="items" style="--position: 8"><img src="Pokemon/Lucario.png" alt=""></div>
            <div class="items" style="--position: 9"><img src="Pokemon/Meowth.png" alt=""></div>
            <div class="items" style="--position: 10"><img src="Pokemon/Mewtwo.png" alt=""></div>
            <div class="items" style="--position: 11"><img src="Pokemon/Pikachu.png" alt=""></div>
            <div class="items" style="--position: 12"><img src="Pokemon/Psyduck.png" alt=""></div>
            <div class="items" style="--position: 13"><img src="Pokemon/Snorlax.png" alt=""></div>
            <div class="items" style="--position: 14"><img src="Pokemon/Squirtle.png" alt=""></div>

        </div>


        <div class="content">
                <h1 data-content="Slide Show">
                    Slide Show
                </h1>
            <div class="author">
                <h2>Saharsh Bhatnagar</h2>
                <p><b>CSS DESIGN</b></p>
                <p>
                    This CSS Slider Design, slide's 14 pokemon images from the series 'Pokemon' with Ash Ketchum being in the middle of web page.
                </p>
            </div>
            <div class="ash"></div>
        </div>
    </div>

</body>
</html>
